<!-- write a jQuery program to validate the darshan enrollment no when user leave the textbox 
(blur). -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>Enrollment No:</label>
    <input type="text" id="enroll">
    <span id="msg"></span>

    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>

    <script>
        $("#enroll").blur(()=>{
            var enroll = $(this).val();
            var pattern = /^[0-9]{11}$/;
            if (pattern.test(enroll)) {
                $("#msg").html("Valid Enrollment Number").css("color", "green");
            } else {
                $("#msg").html("Invalid Enrollment Number").css("color", "red");
            }
        });
    </script>

</body>
</html>
