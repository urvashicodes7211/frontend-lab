<!--  write a jQuery program to append new row to existing table when clicked on button. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <td>hi</td>
            <td>hello</td>
        </tr>
        <tr>
            <td>hi</td>
            <td>hello</td>
        </tr>   
    </table>
    <button class="b1">Click</button>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $(".b1").click(()=>{
            $("table").append("<tr><td>hi</td><td>hello</td></tr>");
        })
    </script>
</body>
</html>
