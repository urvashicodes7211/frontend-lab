<!-- write a jQuery program to set content of h1 to "Hello World" when use click on button. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="myH1">hi</h1>
    <button id="myBtn">click</button>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $("#myBtn").click(()=>{
            $("#myH1").text("Hello World");
        })
    </script>
</body>
</html>
