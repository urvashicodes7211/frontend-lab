<!--  write a jQuery program to change background color of all input tags when clicked on a button -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text">
    <input type="text">
    <input type="text">
    <button class="b1">Click</button>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $(".b1").click(()=>{
            $("input").css("background-color" , "pink");
        })
    </script>
</body>
</html>
