<!--  write a jQuery program to append new list item with "Hello World" to existing unordered list 
when clicked on button -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="i1">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <button id="myBtn">Click</button>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $("#myBtn").click(()=>{
            $("#i1").append("<li>jQuery</li>");
        })
    </script>
</body>
</html>
