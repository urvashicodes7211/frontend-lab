<!--  write a jQuery program to hide all elements with class ""myEle"" when clicked on a button.  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="myEle">hi</h1>
    <ul>
        <li class="myEle">1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li class="myEle">5</li>
    </ul>
    <button class="b1">Click</button>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $(".b1").click(()=>{
            $(".myEle").hide();
        })
    </script>
</body>
</html>
