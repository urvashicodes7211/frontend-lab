<!--  write a jQuery program to set background of an element to red when mouse enter on all 
paragraphs  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Vel aliquam qui nisi sunt blanditiis, quis quam ab facere dolorem reprehenderit voluptatem exercitationem inventore reiciendis! Delectus corporis distinctio nesciunt laudantium voluptates!</p>
    <p>hello</p>
    <p>hi</p>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
    <script>
        $("p").mouseenter(()=>{
            $("p").css("background-color" , "red");
        });
    </script>
</body>
</html>
