<!-- write a jQuery program to hide an element which was clicked  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.min.js"></script>
</head>
<body>
    <p>Hello World</p>
    <h1>Darshan University</h1>
    <div>Rajkot</div>
    <label>Name :</label>
    <input id="input" type="text">
    <button>Click</button>
    
    <script>
        $(document).ready(()=>{
            $("*").click((event)=>{
                $(event.target).hide();
            })
            }
        )
    </script>

    
</body>
</html>
